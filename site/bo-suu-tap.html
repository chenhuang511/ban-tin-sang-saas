<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bộ sưu tập — Highlight &amp; Số đã lưu · Bản tin sáng</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 64px}
.backbar{max-width:820px;margin:0 auto;padding:18px 20px 0}
.backbar a{display:inline-block;font-size:13px;text-decoration:none;background:#eef2ff;color:#4338ca;padding:6px 14px;border-radius:20px}
.masthead{border-bottom:3px solid #111;padding:26px 0 18px;margin-bottom:8px}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#6b7280;font-weight:600}
h1{font-size:28px;margin:6px 0 6px;font-weight:800;letter-spacing:-.02em}
.meta{font-size:14px;color:#6b7280}
.status{font-size:13px;color:#6b7280;margin:14px 0}
h2.sec{font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin:28px 0 12px;border-bottom:1px solid #e5e7eb;padding-bottom:6px}
.favgrid{display:flex;flex-wrap:wrap;gap:10px}
.favcard{display:block;background:#fff;border:1px solid #eee;border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;min-width:200px;flex:1;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.favcard .d{font-size:12px;font-weight:700;color:#e11d48;letter-spacing:.05em}
.favcard .t{font-size:14px;margin-top:4px;color:#1a1a2e;line-height:1.35;font-weight:600}
.favcard .ftags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.favcard .ftags span{font-size:11px;background:#f0eefb;color:#5b34c4;border-radius:20px;padding:2px 9px}
.hlgroup{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 18px;margin:12px 0}
.hlgroup h3{margin:0 0 8px;font-size:15px}
.hlgroup h3 a{color:#4338ca;text-decoration:none}
.hlitem{border-left:4px solid #fde047;padding:6px 12px;margin:8px 0;background:#fafafa;border-radius:6px}
.hlitem.g{border-left-color:#86efac}.hlitem.p{border-left-color:#f9a8d4}.hlitem.b{border-left-color:#93c5fd}
.hlitem .q{font-size:14.5px}
.hlitem .n{font-size:13px;color:#6b7280;margin-top:4px}
.empty{color:#9ca3af;font-size:14px;padding:10px 0}
.foot{text-align:center;color:#9ca3af;font-size:13px;margin-top:40px}
</style>
</head>
<body>
<div class="backbar"><a href="/">← Về trang bìa</a></div>
<div class="wrap">
  <header class="masthead">
    <div class="kicker">Bản tin sáng · Cá nhân</div>
    <h1>🔖 Bộ sưu tập của bạn</h1>
    <div class="meta">Số yêu thích &amp; các đoạn bạn đã bôi — đồng bộ dài hạn qua tài khoản.</div>
  </header>

  <div class="status" id="status">Đang tải…</div>

  <h2 class="sec">♥ Số yêu thích</h2>
  <div class="favgrid" id="favs"></div>

  <h2 class="sec">✎ Highlight theo số</h2>
  <div id="hls"></div>

  <div class="foot"><a href="/" style="color:#4338ca;text-decoration:none">← Về trang bìa lưu trữ</a></div>
</div>

<script src="/reader.js" defer></script>
<script>
(function(){
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
  function colorClass(c){return c==="g"?"g":c==="p"?"p":c==="b"?"b":"";}

  function fromLocal(){
    var R = window.BTSReader;
    var favObj = R ? R.localFavourites() : {};
    var hlObj = R ? R.localHighlights() : {};
    var favs = Object.keys(favObj).filter(function(p){return favObj[p] && !favObj[p].deleted;})
                .map(function(p){return {page:p, created_at:favObj[p].createdAt};});
    var hls = [];
    Object.keys(hlObj).forEach(function(p){
      (hlObj[p]||[]).forEach(function(h){ if(!h.deleted) hls.push(h); });
    });
    return {favs:favs, hls:hls, source:"local"};
  }

  // Bản đồ page -> {href,title,tags} lấy từ trang bìa
  var META={};
  function fmtDate(p){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(p||"");return m?(m[3]+"/"+m[2]+"/"+m[1]):(p||"");}
  function metaOf(p){return META[p]||{href:"/"+p,title:p,tags:[]};}
  function loadMeta(){
    return fetch("/").then(function(r){return r.text();}).then(function(html){
      var doc=new DOMParser().parseFromString(html,"text/html");var map={};
      [].forEach.call(doc.querySelectorAll(".edcard"),function(a){
        var href=a.getAttribute("href")||"";var p=href.replace(/^\//,"").replace(/\.html$/,"");
        var h2=a.querySelector("h2");
        var tags=[].map.call(a.querySelectorAll(".tag"),function(t){return t.textContent.trim();});
        map[p]={href:href||("/"+p),title:h2?h2.textContent.trim():p,tags:tags};
      });
      return map;
    }).catch(function(){return {};});
  }

  function render(data){
    // favourites
    var favEl = document.getElementById("favs");
    if(!data.favs.length){ favEl.innerHTML='<div class="empty">Chưa có số yêu thích nào. Mở một số và bấm “♡ Yêu thích”.</div>'; }
    else{
      data.favs.sort(function(a,b){return (b.created_at||0)-(a.created_at||0);});
      favEl.innerHTML = data.favs.map(function(f){
        var m=metaOf(f.page);
        return '<a class="favcard" href="'+esc(m.href)+'"><div class="d">❤ '+esc(fmtDate(f.page))+'</div>'+
               '<div class="t">'+esc(m.title)+'</div>'+
               (m.tags.length?'<div class="ftags">'+m.tags.map(function(t){return '<span>'+esc(t)+'</span>';}).join("")+'</div>':'')+
               '</a>';
      }).join("");
    }
    // highlights grouped by page
    var byPage = {};
    data.hls.forEach(function(h){ (byPage[h.page]=byPage[h.page]||[]).push(h); });
    var pages = Object.keys(byPage).sort().reverse();
    var hlEl = document.getElementById("hls");
    if(!pages.length){ hlEl.innerHTML='<div class="empty">Chưa có highlight nào. Bôi chọn một đoạn trong bài để tô màu.</div>'; return; }
    hlEl.innerHTML = pages.map(function(p){
      var items = byPage[p].sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);}).map(function(h){
        return '<div class="hlitem '+colorClass(h.color)+'"><div class="q">“'+esc(h.quote)+'”</div>'+
               (h.note?'<div class="n">📝 '+esc(h.note)+'</div>':'')+'</div>';
      }).join("");
      var m=metaOf(p);
      return '<div class="hlgroup"><h3><a href="'+esc(m.href)+'">'+esc(fmtDate(p))+' — '+esc(m.title)+'</a> · '+byPage[p].length+' đoạn</h3>'+items+'</div>';
    }).join("");
  }

  function boot(){
    loadMeta().then(function(m){ META=m; boot2(); });
  }
  function boot2(){
    var R = window.BTSReader;
    var statusEl = document.getElementById("status");
    // Thử server trước; nếu không có, dùng local.
    if(R && R.api){
      Promise.all([R.api("/favourites"), R.api("/highlights")]).then(function(res){
        var favs = res[0]||[]; var hls = (res[1]||[]).map(function(r){return r;});
        statusEl.textContent = "Đồng bộ từ tài khoản của bạn ✓";
        render({favs:favs, hls:hls});
      }).catch(function(){
        var d = fromLocal();
        statusEl.textContent = "Hiển thị dữ liệu lưu trên trình duyệt này (backend chưa bật hoặc chưa đăng nhập).";
        render(d);
      });
    } else {
      var d = fromLocal();
      statusEl.textContent = "Hiển thị dữ liệu lưu trên trình duyệt này.";
      render(d);
    }
  }
  // reader.js nạp bằng defer; đợi nó xong.
  if(document.readyState==="complete") boot();
  else window.addEventListener("load", boot);
})();
</script>
</body>
</html>
